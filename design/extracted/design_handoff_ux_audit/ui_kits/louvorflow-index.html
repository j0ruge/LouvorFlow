<!doctype html>
<!-- @dsCard group="UI Kit — Louvorflow" name="LouvorFlow UI Kit" subtitle="Shell + 11 telas sincronizadas com o app (branch master) · mobile-first" viewport="1280x820" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LouvorFlow — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css?v=sora">
<style>
/* LouvorFlow UI Kit — shell (mobile-first)
 *
 * Base: mobile portrait (≥ 360 px). Sidebar is a slide-in drawer.
 * Breakpoints:
 *   640  — sm  : bigger type, content gets breathing room
 *   900  — md  : sidebar becomes collapsed rail (64 px)
 *   1200 — lg  : sidebar becomes full (260 px)
 * Consumes tokens from ../../colors_and_type.css
 */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  color: hsl(var(--foreground));
  background: hsl(var(--background));
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* ── Layout shell (mobile-first) ─────────────────────────── */
.app {
  min-height: 100vh;
  background: linear-gradient(180deg, hsl(var(--background)), hsl(35 35% 94%));
  display: flex;
  flex-direction: column;
}
.dark .app { background: linear-gradient(180deg, hsl(var(--background)), hsl(30 10% 14%)); }

/* Sidebar is an off-canvas drawer on mobile. */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: min(84vw, 280px);
  z-index: 40;
  background: hsl(var(--sidebar-background));
  border-right: 1px solid hsl(var(--sidebar-border));
  display: flex; flex-direction: column;
  padding: 14px 10px;
  gap: 4px;
  transform: translateX(-100%);
  transition: transform 220ms ease;
  overflow: hidden;
  box-shadow: 0 24px 60px -20px hsl(30 40% 10% / 0.35);
}
.app.drawer-open .sidebar { transform: translateX(0); }
.scrim {
  position: fixed; inset: 0; background: hsl(30 40% 10% / 0.4);
  z-index: 30; opacity: 0; pointer-events: none;
  transition: opacity 180ms ease;
}
.app.drawer-open .scrim { opacity: 1; pointer-events: auto; }

/* Brand */
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px 14px;
  border-bottom: 1px solid hsl(var(--sidebar-border));
  margin-bottom: 8px;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  background: var(--gradient-primary);
  display: flex; align-items: center; justify-content: center;
  color: #fff; box-shadow: var(--shadow-soft);
}
.brand-mark svg { width: 20px; height: 20px; }
.brand-name {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;

  color: hsl(var(--sidebar-foreground));
  white-space: nowrap; overflow: hidden;
}

/* Nav */
nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav-group-label {
  font-size: 10.5px; font-weight: 700;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 10px;
  border-radius: 8px;
  font-size: 15px; font-weight: 500;
  color: hsl(var(--sidebar-foreground));
  text-decoration: none;
  transition: background 150ms, color 150ms;
  white-space: nowrap;
  min-height: 44px; /* touch target */
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; color: hsl(var(--muted-foreground)); }
.nav-item:hover { background: hsl(var(--sidebar-accent)); }
.nav-item:hover svg { color: hsl(var(--foreground)); }
.nav-item.active {
  background: hsl(var(--sidebar-accent));
  font-weight: 600; color: hsl(var(--foreground));
}
.nav-item.active svg { color: hsl(var(--primary)); }

.sidebar-footer { border-top: 1px solid hsl(var(--sidebar-border)); padding-top: 10px; }
.tenant { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
.tenant-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: hsl(var(--muted));
  display: flex; align-items: center; justify-content: center;
  color: hsl(var(--muted-foreground)); flex-shrink: 0;
}
.tenant-mark svg { width: 16px; height: 16px; }
.tenant-name { font-size: 13px; font-weight: 700; color: hsl(var(--foreground)); line-height: 1.2; }
.tenant-role { font-size: 11px; color: hsl(var(--muted-foreground)); margin-top: 2px; }

/* ── Main ────────────────────────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; flex: 1; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  height: 56px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  background: hsla(var(--background) / 0.85);
  border-bottom: 1px solid hsl(var(--border));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.icon-btn {
  width: 44px; height: 44px; border-radius: 10px;
  background: transparent; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  color: hsl(var(--foreground));
  transition: background 150ms;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { background: hsl(var(--muted)); }

.topbar-brand {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700; letter-spacing: -0.02em;

  color: hsl(var(--foreground));
}
.topbar-brand .brand-mark { width: 30px; height: 30px; border-radius: 8px; }
.topbar-brand .brand-mark svg { width: 16px; height: 16px; }

.crumbs { display: none; font-size: 13px; color: hsl(var(--muted-foreground)); font-weight: 500; }
.spacer { flex: 1; }

.user-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 6px 4px 4px;
  background: transparent;
  border: 1px solid hsl(var(--border));
  border-radius: 9999px;
  cursor: pointer;
  transition: background 150ms;
  font-family: inherit;
  min-height: 36px;
}
.user-chip:hover { background: hsl(var(--muted)); }
.avatar {
  width: 28px; height: 28px; border-radius: 9999px;
  background: var(--gradient-primary);
  color: #fff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.02em;
}
.user-meta { display: none; text-align: left; line-height: 1.1; padding-right: 6px; }
.user-name { font-size: 12.5px; font-weight: 700; color: hsl(var(--foreground)); }
.user-role { font-size: 10.5px; color: hsl(var(--muted-foreground)); margin-top: 1px; }

/* Content */
.content { padding: 18px 16px 32px; flex: 1; min-width: 0; }

/* Page head */
.page-head {
  margin-bottom: 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.page-head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-title {
  font-family: var(--font-display);
  font-size: 28px; line-height: 1.05;
  font-weight: 700; letter-spacing: -0.02em;

  background: var(--gradient-primary);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  margin: 0;
}
.page-sub { margin: 4px 0 0; font-size: 14px; color: hsl(var(--muted-foreground)); }

.section-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 600;

  color: hsl(var(--foreground));
  margin: 0;
  display: flex; align-items: center; gap: 10px;
}
.section-title svg { width: 18px; height: 18px; color: hsl(var(--primary)); }

/* Primitives */
.btn {
  height: 44px; padding: 0 16px; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity 150ms, background 150ms;
  min-height: 44px; /* touch */
}
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--gradient-primary); color: #fff; box-shadow: var(--shadow-soft); }
.btn-primary:hover { opacity: 0.92; }
.btn-outline { background: transparent; color: hsl(var(--foreground)); border: 1px solid hsl(var(--border)); }
.btn-outline:hover { background: hsl(var(--muted)); }
.btn-sm { height: 38px; padding: 0 12px; font-size: 13px; border-radius: 8px; min-height: 38px; }
.btn-icon-only { padding: 0; width: 44px; }

.card {
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 14px;
  box-shadow: var(--shadow-soft);
  padding: 16px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }

.input {
  width: 100%;
  height: 44px;
  padding: 0 14px 0 40px;
  border-radius: 10px;
  border: 1px solid hsl(var(--border));
  background: hsl(var(--card));
  font-family: inherit; font-size: 15px;
  color: hsl(var(--foreground));
  transition: border-color 150ms, box-shadow 150ms;
}
.input:focus { outline: none; border-color: hsl(var(--primary)); box-shadow: 0 0 0 3px hsla(38,80%,52%,0.15); }
.input-wrap { position: relative; flex: 1; min-width: 0; }
.input-wrap > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: hsl(var(--muted-foreground)); }

.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px;
  border-radius: 9999px;
  font-size: 11.5px; font-weight: 600; line-height: 1.2;
}
.badge-soft { background: hsla(38,80%,52%,0.12); color: hsl(38 70% 35%); }
.dark .badge-soft { background: hsla(40,65%,55%,0.18); color: hsl(40 65% 72%); }
.badge-outline { border: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); }

/* ───────────────────────────────────────────────────────────
   ≥ 640 px  (sm) — tablet portrait
   ─────────────────────────────────────────────────────────── */
@media (min-width: 640px) {
  .content { padding: 24px 24px 40px; }
  .card { padding: 20px 22px; }
  .page-title { font-size: 32px; }
  .user-meta { display: block; }
}

/* ───────────────────────────────────────────────────────────
   ≥ 900 px  (md) — sidebar becomes permanent rail (64 px)
   ─────────────────────────────────────────────────────────── */
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 64px 1fr; }
  .sidebar {
    position: sticky; top: 0; height: 100vh;
    width: auto;
    transform: none !important;
    box-shadow: none;
  }
  .scrim { display: none; }
  .brand-name,
  .nav-item span,
  .nav-group-label,
  .tenant-text { display: none; }
  .nav-item { justify-content: center; padding: 11px; }
  .topbar-brand { display: none; }
  .crumbs { display: block; }
  .icon-btn.menu-only { display: none; }
  .topbar { padding: 0 24px; height: 64px; }
}

/* ───────────────────────────────────────────────────────────
   ≥ 1200 px  (lg) — expanded sidebar
   ─────────────────────────────────────────────────────────── */
@media (min-width: 1200px) {
  .app { grid-template-columns: 260px 1fr; }
  .brand-name,
  .nav-item span,
  .nav-group-label,
  .tenant-text { display: block; }
  .nav-item { justify-content: flex-start; padding: 10px 12px; }
  .content { padding: 28px 32px 48px; }
  .page-title { font-size: 34px; }
}

/* ───────────────────────────────────────────────────────────
   Views: grids & lists (mobile-first)
   ─────────────────────────────────────────────────────────── */

/* stat grid */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat {
  position: relative; overflow: hidden;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 14px;
  padding: 14px;
  box-shadow: var(--shadow-soft);
}
.stat .tint {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-light)));
  opacity: 0.06; pointer-events: none;
}
.stat h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: 0.04em; }
.stat .val {
  font-family: var(--font-display);
  font-size: 30px; font-weight: 700; line-height: 1;
  color: hsl(var(--foreground));

}
.stat .foot { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
.stat .ic {
  position: absolute; top: 12px; right: 12px;
  width: 32px; height: 32px; border-radius: 8px;
  background: hsla(38,80%,52%,0.12);
  display: flex; align-items: center; justify-content: center;
  color: hsl(var(--primary));
}
.stat .ic svg { width: 16px; height: 16px; }

@media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; } .stat { padding: 18px; } }

/* Dashboard: two-up on md+ */
.dash-grid { display: grid; gap: 14px; grid-template-columns: 1fr; margin-top: 18px; }
@media (min-width: 900px) { .dash-grid { grid-template-columns: 1fr 1fr; gap: 18px; } }

/* Event row (inside dashboard upcoming card) */
.event-row {
  display: flex; gap: 12px; align-items: center;
  padding: 12px;
  background: linear-gradient(135deg, hsl(var(--card)), hsl(35 25% 97%));
  border: 1px solid hsl(var(--border));
  border-radius: 12px;
}
.dark .event-row { background: linear-gradient(135deg, hsl(30 10% 15%), hsl(30 8% 17%)); }
.event-date {
  width: 52px; flex-shrink: 0; text-align: center;
  padding: 6px 0;
  border-radius: 10px;
  background: hsla(38,80%,52%,0.1);
  color: hsl(var(--primary));
}
.event-date .d { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1; }
.event-date .m { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }
.event-body { min-width: 0; flex: 1; }
.event-title { font-size: 14px; font-weight: 700; color: hsl(var(--foreground)); line-height: 1.25; }
.event-meta { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 3px; }
.event-tag { margin-left: auto; flex-shrink: 0; }

/* Team row */
.member-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid hsl(var(--border)); border-radius: 10px; background: hsl(var(--card)); }
.member-avatar { width: 36px; height: 36px; border-radius: 9999px; background: var(--gradient-primary); color:#fff; font-size: 12px; font-weight: 700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.member-name { font-size: 14px; font-weight: 600; color: hsl(var(--foreground)); line-height: 1.25; }
.member-role { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 2px; }

/* ── Songs list (mobile-first card stack) ───────────────── */
.songs-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.songs-toolbar .input-wrap { flex: 1 1 100%; }
@media (min-width: 640px) { .songs-toolbar .input-wrap { flex: 1 1 auto; } }

.song-list { display: flex; flex-direction: column; gap: 10px; }
.song {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  grid-template-rows: auto auto;
  gap: 4px 12px;
  padding: 12px;
  background: linear-gradient(135deg, hsl(var(--card)), hsl(35 25% 97%));
  border: 1px solid hsl(var(--border));
  border-radius: 12px;
  cursor: pointer;
  transition: box-shadow 200ms, border-color 150ms;
}
.dark .song { background: linear-gradient(135deg, hsl(30 10% 15%), hsl(30 8% 17%)); }
.song:hover { box-shadow: var(--shadow-medium); border-color: hsla(38,80%,52%,0.35); }
.song-tile {
  grid-row: 1 / 3;
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--gradient-primary);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.song-tile svg { width: 20px; height: 20px; }
.song-title { grid-column: 2 / 3; font-size: 15px; font-weight: 700; color: hsl(var(--foreground)); line-height: 1.2; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
.song-artist { grid-column: 2 / 3; font-size: 12.5px; color: hsl(var(--muted-foreground)); line-height: 1.2; }
.song-key {
  grid-row: 1 / 3; grid-column: 3 / 4;
  align-self: center;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
}
.song-key .k {
  font-family: var(--font-display);
  font-weight: 700; font-size: 18px; color: hsl(var(--foreground));

  line-height: 1;
}
.song-key .bpm { font-size: 11px; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }

/* On ≥ 640 px give the row more horizontal affordance */
@media (min-width: 640px) {
  .song {
    grid-template-columns: 48px 1fr auto auto auto;
    grid-template-rows: auto;
    align-items: center;
    padding: 14px 16px;
    gap: 16px;
  }
  .song-tile { grid-row: auto; width: 48px; height: 48px; }
  .song-title { grid-column: auto; white-space: nowrap; }
  .song-artist {
    grid-column: auto;
    white-space: nowrap;
    font-size: 13px;
  }
  .song-title, .song-artist { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .song-artist { color: hsl(var(--muted-foreground)); }
  .song-title::after { content: ""; }
  /* Swap to flat 1-row layout */
  .song {
    grid-template-areas: "tile title artist meta key";
  }
  .song-tile { grid-area: tile; }
  .song-title { grid-area: title; }
  .song-artist { grid-area: artist; }
  .song-meta { grid-area: meta; display: flex; gap: 12px; align-items: center; color: hsl(var(--muted-foreground)); font-size: 13px; font-variant-numeric: tabular-nums; }
  .song-key { grid-area: key; flex-direction: row; gap: 10px; align-items: center; }
  .song-key .bpm { display: none; }
}

/* Section header (between page-head and grid) */
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 10px; }

/* Tabs (used in dashboard "Próximas / Passadas") */
.tabs { display: inline-flex; background: hsl(var(--muted)); padding: 3px; border-radius: 10px; margin-bottom: 10px; }
.tab {
  border: 0; background: transparent;
  font-family: inherit; font-size: 13px; font-weight: 600;
  color: hsl(var(--muted-foreground));
  padding: 7px 14px; border-radius: 8px; cursor: pointer;
  min-height: 36px;
}
.tab.active { background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: var(--shadow-soft); }

/* ── Escalas (cards detalhados) ─────────────────────────── */
.escala-list { display: flex; flex-direction: column; gap: 12px; }
.escala {
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: var(--shadow-soft);
}
.escala-head {
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  margin-bottom: 10px;
}
.escala-date-block {
  text-align: center; width: 56px; flex-shrink: 0;
  padding: 6px 0; border-radius: 10px;
  background: hsla(38,80%,52%,0.1); color: hsl(var(--primary));
}
.escala-date-block .d { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; }
.escala-date-block .m { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }
.escala-info { flex: 1; min-width: 0; }
.escala-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: hsl(var(--foreground)); line-height: 1.2; }
.escala-when { font-size: 12.5px; color: hsl(var(--muted-foreground)); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
.escala-when span { display: inline-flex; align-items: center; gap: 4px; }
.escala-when svg { width: 12px; height: 12px; }
.escala-body { display: grid; grid-template-columns: 1fr; gap: 10px; padding-top: 10px; border-top: 1px dashed hsl(var(--border)); }
@media (min-width: 640px) { .escala-body { grid-template-columns: 1fr 1fr; gap: 14px; } }
.escala-section-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: 6px; }
.escala-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.esc-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 4px;
  background: hsl(var(--muted));
  border-radius: 9999px;
  font-size: 12px; font-weight: 500;
  color: hsl(var(--foreground));
}
.esc-chip .dot {
  width: 20px; height: 20px; border-radius: 9999px;
  background: var(--gradient-primary); color:#fff;
  font-size: 9px; font-weight: 700;
  display:flex; align-items:center; justify-content:center;
}
.esc-song { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: hsl(var(--muted)); border-radius: 8px; font-size: 12.5px; color: hsl(var(--foreground)); }
.esc-song .k { font-family: var(--font-display); font-weight: 700; color: hsl(var(--primary)); min-width: 24px; }
.esc-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed hsl(var(--border)); }

/* ── Integrantes (cards) ────────────────────────────────── */
.members-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 768px) { .members-grid { grid-template-columns: repeat(2, 1fr); } }
.member-card {
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 14px; padding: 18px 16px;
  box-shadow: var(--shadow-soft);
  display: flex; gap: 14px; align-items: flex-start;
}
.member-card .lg-avatar {
  width: 52px; height: 52px; border-radius: 9999px;
  background: var(--gradient-primary); color:#fff;
  font-size: 17px; font-weight: 700;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow: var(--shadow-soft);
}
.member-card .mc-body { flex: 1; min-width: 0; }
.member-card .mc-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: hsl(var(--foreground)); line-height: 1.2; }
.member-card .mc-role { font-size: 12.5px; color: hsl(var(--muted-foreground)); margin-top: 3px; }
.member-card .mc-contacts { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
.member-card .mc-contacts span { font-size: 12px; color: hsl(var(--muted-foreground)); display: inline-flex; align-items: center; gap: 6px; }
.member-card .mc-contacts svg { width: 12px; height: 12px; }
.member-card .mc-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }

/* ── Histórico (timeline) ──────────────────────────────── */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: hsl(var(--border)); }
.hist-item { position: relative; padding-bottom: 18px; }
.hist-item::before {
  content: ""; position: absolute; left: -22px; top: 14px;
  width: 14px; height: 14px; border-radius: 9999px;
  background: hsl(var(--primary)); box-shadow: 0 0 0 4px hsl(var(--background));
}
.hist-card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-soft); }
.hist-when { font-size: 11.5px; color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.hist-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: hsl(var(--foreground)); margin-top: 2px; }
.hist-meta { font-size: 12.5px; color: hsl(var(--muted-foreground)); margin-top: 4px; }

/* ── Relatórios (KPIs + bar chart) ─────────────────────── */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
@media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; } }
.kpi {
  background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px;
  padding: 14px; box-shadow: var(--shadow-soft);
}
.kpi .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }
.kpi .val { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; color: hsl(var(--foreground)); margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 11.5px; font-weight: 600; margin-top: 4px; display: inline-flex; align-items: center; gap: 3px; }
.kpi .delta.up { color: #2f8a4b; }
.kpi .delta.down { color: hsl(var(--accent)); }
.bars { display: grid; grid-template-columns: 1fr; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .bn { color: hsl(var(--foreground)); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .bt {
  height: 10px; background: hsl(var(--muted)); border-radius: 9999px; overflow: hidden; position: relative;
}
.bar-row .bt > span { display: block; height: 100%; background: var(--gradient-primary); border-radius: 9999px; }
.bar-row .bv { text-align: right; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }

/* ── Igreja ────────────────────────────────────────────── */
.church-head {
  display: flex; gap: 16px; padding: 18px; align-items: center;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 14px;
  box-shadow: var(--shadow-soft); margin-bottom: 16px;
}
.church-mark {
  width: 64px; height: 64px; border-radius: 16px;
  background: var(--gradient-primary); color: #fff;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.church-mark svg { width: 32px; height: 32px; }
.church-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: hsl(var(--foreground)); line-height: 1.15; }
.church-sub { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
.ministry-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .ministry-grid { grid-template-columns: 1fr 1fr; gap: 14px; } }
.ministry {
  background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px;
  padding: 14px; box-shadow: var(--shadow-soft);
  display: flex; align-items: center; gap: 12px;
}
.ministry .mi-ic {
  width: 40px; height: 40px; border-radius: 10px;
  background: hsla(38,80%,52%,0.12); color: hsl(var(--primary));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ministry .mi-ic svg { width: 18px; height: 18px; }
.ministry .mi-name { font-weight: 700; font-size: 14px; color: hsl(var(--foreground)); line-height: 1.2; }
.ministry .mi-meta { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 2px; }

/* ── Configurações (settings) ─────────────────────────── */
.settings-group { margin-bottom: 18px; }
.settings-group h3 {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700; margin: 0 0 8px;
  color: hsl(var(--foreground));
  text-transform: none; letter-spacing: 0;
  display: flex; align-items: center; gap: 8px;
}
.settings-group h3 svg { width: 16px; height: 16px; color: hsl(var(--primary)); }
.settings-list { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-soft); }
.settings-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid hsl(var(--border));
  min-height: 52px;
}
.settings-row:last-child { border-bottom: 0; }
.settings-row .s-info { flex: 1; min-width: 0; }
.settings-row .s-name { font-size: 14px; font-weight: 600; color: hsl(var(--foreground)); }
.settings-row .s-hint { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
.settings-row .s-ctl { flex-shrink: 0; }
.toggle {
  --on: hsl(var(--primary));
  position: relative; width: 42px; height: 24px; border-radius: 9999px;
  background: hsl(var(--muted)); cursor: pointer; border: 0; padding: 0;
  transition: background 150ms;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 9999px; background: #fff;
  transition: transform 150ms;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.2);
}
.toggle.on { background: hsl(var(--primary)); }
.toggle.on::after { transform: translateX(18px); }
.select-input {
  height: 34px; padding: 0 28px 0 10px;
  border: 1px solid hsl(var(--border)); border-radius: 8px;
  background: hsl(var(--card)); color: hsl(var(--foreground));
  font-family: inherit; font-size: 13px; font-weight: 500;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%23888' stroke-width='1.5' d='M1 1l4 4 4-4'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center;
}

/* ── Modal (form dialogs) ─────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: hsl(30 40% 10% / 0.55);
  z-index: 50;
  display: none;
  align-items: flex-end; justify-content: center;
  padding: 0;
}
.modal-backdrop.open { display: flex; }
.dark .modal-backdrop { background: hsl(0 0% 0% / 0.7); }
.modal {
  background: hsl(var(--card));
  width: 100%;
  max-width: 640px;
  max-height: 92vh;
  border-radius: 18px 18px 0 0;
  border: 1px solid hsl(var(--border));
  border-bottom: 0;
  box-shadow: 0 -20px 60px -20px hsl(30 40% 10% / 0.4);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: modal-in 220ms cubic-bezier(.2,.9,.3,1);
  position: relative;
}
@keyframes modal-in { from { transform: translateY(12%); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 20px 14px;
  border-bottom: 1px solid hsl(var(--border));
}
.modal-head .mh-ic {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--gradient-primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: var(--shadow-soft);
}
.modal-head .mh-ic svg { width: 20px; height: 20px; }
.modal-head h2 {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
  margin: 0; color: hsl(var(--foreground)); line-height: 1.2;
}
.modal-head .mh-sub { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
.modal-close {
  margin-left: auto;
  width: 36px; height: 36px; border-radius: 9px;
  border: 0; background: transparent; cursor: pointer;
  color: hsl(var(--muted-foreground));
  display: inline-flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.modal-close svg { width: 18px; height: 18px; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-foot {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 20px;
  border-top: 1px solid hsl(var(--border));
  background: hsl(var(--muted) / 0.3);
}
.form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 520px) { .form-grid.two { grid-template-columns: 1fr 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: hsl(var(--muted-foreground)); }
.field .hint { font-size: 11.5px; color: hsl(var(--muted-foreground)); }
.field .input,
.field textarea,
.field select {
  width: 100%; height: 44px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid hsl(var(--border));
  background: hsl(var(--card));
  font-family: inherit; font-size: 14px;
  color: hsl(var(--foreground));
  transition: border-color 150ms, box-shadow 150ms;
}
.field textarea { height: auto; min-height: 80px; padding: 12px 14px; resize: vertical; font-family: inherit; }
.field .input:focus,
.field textarea:focus,
.field select:focus { outline: none; border-color: hsl(var(--primary)); box-shadow: 0 0 0 3px hsla(38,80%,52%,0.15); }
.field select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%23888' stroke-width='1.5' d='M1 1l4 4 4-4'/></svg>");
  background-repeat: no-repeat; background-position: right 14px center;
  padding-right: 38px;
}
.chip-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-pick button {
  border: 1px solid hsl(var(--border));
  background: hsl(var(--card));
  color: hsl(var(--foreground));
  padding: 7px 12px; border-radius: 9999px;
  font-family: inherit; font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  transition: background 150ms, border-color 150ms, color 150ms;
}
.chip-pick button:hover { background: hsl(var(--muted)); }
.chip-pick button.on {
  background: var(--gradient-primary); border-color: transparent; color: #fff;
}
.picker-list {
  max-height: 180px; overflow-y: auto;
  border: 1px solid hsl(var(--border)); border-radius: 10px;
  background: hsl(var(--card));
}
.picker-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid hsl(var(--border));
  cursor: pointer;
  font-size: 13.5px;
}
.picker-row:last-child { border-bottom: 0; }
.picker-row:hover { background: hsl(var(--muted)); }
.picker-row .chk {
  width: 18px; height: 18px; border-radius: 5px;
  border: 1.5px solid hsl(var(--border));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  background: hsl(var(--card));
}
.picker-row .chk svg { width: 12px; height: 12px; color: #fff; display: none; }
.picker-row.on .chk { background: hsl(var(--primary)); border-color: hsl(var(--primary)); }
.picker-row.on .chk svg { display: block; }
.picker-row .pn { flex: 1; font-weight: 500; color: hsl(var(--foreground)); }
.picker-row .pm { color: hsl(var(--muted-foreground)); font-size: 12px; }

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 24px; }
  .modal { border-radius: 18px; border-bottom: 1px solid hsl(var(--border)); max-height: 86vh; }
  @keyframes modal-in { from { transform: translateY(12px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
}

/* ── Data table (admin) ──────────────────────── */
.table-wrap { overflow-x: auto; }
table.dt { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.dt th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: hsl(var(--muted-foreground)); padding: 10px 12px; border-bottom: 1px solid hsl(var(--border)); white-space: nowrap; }
.dt td { padding: 12px; border-bottom: 1px solid hsl(var(--border)); color: hsl(var(--foreground)); vertical-align: middle; }
.dt tbody tr { transition: background 150ms; }
.dt tbody tr:hover { background: hsl(var(--muted) / 0.5); }
.dt tr:last-child td { border-bottom: 0; }
.td-actions { text-align: right; white-space: nowrap; }
.td-actions .btn { margin-left: 6px; }
.count-line { display: flex; align-items: center; gap: 8px; color: hsl(var(--muted-foreground)); font-size: 13px; margin-bottom: 14px; }
.count-line svg { width: 18px; height: 18px; }
.badge-success { background: hsl(145 45% 90%); color: hsl(145 60% 24%); }
.dark .badge-success { background: hsl(145 30% 18%); color: hsl(145 40% 68%); }
.badge-muted { background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); }

/* ── Filter chips (Músicas) ───────────────────── */
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; min-height: 32px; border-radius: 9999px; border: 1px solid hsl(var(--border)); background: transparent; color: hsl(var(--foreground)); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background 150ms, color 150ms, border-color 150ms; }
.fchip:hover { background: hsla(38,80%,52%,0.1); }
.fchip.on { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.ibars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.ibars i { width: 2.5px; border-radius: 1px; background: currentColor; opacity: 0.3; }
.ibars i.f { opacity: 1; }
.song-meta { display: none; }
.btn:disabled { opacity: 0.5; pointer-events: none; }
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; }
.pager .pg { font-size: 13px; color: hsl(var(--muted-foreground)); padding: 0 10px; }
.stat { transition: box-shadow 300ms; }
.stat:hover { box-shadow: var(--shadow-glow); }

/* ── Ranking + progresso (Relatórios) ─────────────── */
.rank-tile { width: 32px; height: 32px; border-radius: 8px; background: var(--gradient-primary); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.progress { height: 8px; background: hsl(var(--muted)); border-radius: 9999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--gradient-primary); border-radius: 9999px; }
.grad-num { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ── Histórico (linhas) ──────────────────────── */
.hist-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 16px; background: linear-gradient(135deg, hsl(var(--card)), hsl(35 25% 97%)); border: 1px solid hsl(var(--border)); border-radius: 12px; transition: box-shadow 300ms; }
.dark .hist-row { background: linear-gradient(135deg, hsl(30 10% 15%), hsl(30 8% 17%)); }
.hist-row:hover { box-shadow: var(--shadow-medium); }
.hist-tile { width: 52px; height: 52px; border-radius: 12px; background: var(--gradient-primary); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hist-tile svg { width: 24px; height: 24px; }
.hist-counts { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.hc { text-align: center; }
.hc-l { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: hsl(var(--muted-foreground)); margin-bottom: 4px; }
.hc-l svg { width: 14px; height: 14px; }
.hc-v { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1; }

/* ── CRUD (Configurações) ────────────────────── */
.crud-add { display: flex; gap: 8px; margin-bottom: 14px; }
.crud-add .input { padding-left: 14px; }
.crud-list { display: flex; flex-direction: column; gap: 8px; }
.crud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 14px; border: 1px solid hsl(var(--border)); border-radius: 10px; background: hsl(var(--card)); }
.crud-row .cname { font-size: 14px; font-weight: 600; color: hsl(var(--foreground)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-ghost { width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: hsl(var(--muted-foreground)); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 150ms, color 150ms; flex-shrink: 0; }
.icon-ghost:hover { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.icon-ghost.danger:hover { color: hsl(var(--destructive)); }
.icon-ghost svg { width: 16px; height: 16px; }
.btn-danger-outline { background: transparent; border: 1px solid hsl(var(--border)); color: hsl(var(--destructive)); }
.btn-danger-outline:hover { background: hsla(0, 72%, 51%, 0.08); }
.btn-danger { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
.btn-danger:hover { opacity: 0.9; }
.tabs.grow { display: flex; }
.tabs.grow .tab { flex: 1; }
.tabs.scroll-x { max-width: 100%; overflow-x: auto; }

/* Empty / placeholder state */
.empty {
  text-align: center; padding: 60px 20px;
  background: hsl(var(--card)); border: 1px dashed hsl(var(--border)); border-radius: 14px;
}
.empty-ic {
  width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 12px;
  background: hsla(38,80%,52%,0.12); color: hsl(var(--primary));
  display:flex; align-items:center; justify-content:center;
}
.empty-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: hsl(var(--foreground)); }
.empty-sub { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 4px; max-width: 42ch; margin-left: auto; margin-right: auto; }

/* ── Toast / feedback ─────────────────────────── */
.toast-host{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{display:flex;align-items:center;gap:10px;background:hsl(30 15% 18%);color:hsl(38 30% 96%);padding:12px 14px;border-radius:12px;box-shadow:var(--shadow-medium);font-size:13.5px;font-weight:500;animation:toast-in 200ms ease-out}
.dark .toast{background:hsl(35 20% 92%);color:hsl(30 12% 14%)}
@keyframes toast-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast svg{width:16px;height:16px;flex-shrink:0;color:hsl(var(--primary))}
.toast .t-msg{flex:1;min-width:0}
.toast .t-undo{border:0;background:transparent;color:hsl(38 85% 62%);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:6px;flex-shrink:0}
.dark .toast .t-undo{color:hsl(38 70% 35%)}
.toast .t-undo:hover{background:hsl(0 0% 100% / 0.12)}
/* Campos obrigatórios + erro por campo */
.req{color:hsl(var(--destructive));margin-left:2px}
.req-legend{font-size:11.5px;color:hsl(var(--muted-foreground));margin:0 0 14px}
.field.error .input,.field.error select,.field.error textarea{border-color:hsl(var(--destructive));box-shadow:0 0 0 3px hsla(0,72%,51%,0.12)}
.f-err{display:none;font-size:12px;font-weight:500;color:hsl(var(--destructive))}
.field.error .f-err{display:block}
/* Veil de confirmação dentro da modal */
.discard-veil{position:absolute;inset:0;background:hsl(var(--card) / 0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:5;padding:24px;text-align:center}
.discard-veil h3{font-family:var(--font-display);font-size:17px;font-weight:700;margin:0;color:hsl(var(--foreground))}
.discard-veil p{margin:0 0 10px;font-size:13px;color:hsl(var(--muted-foreground));max-width:38ch}
.discard-veil .dv-actions{display:flex;gap:10px}
/* Repertório selecionado (ordenável) */
.rep-sel{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.rep-row{display:flex;align-items:center;gap:6px;padding:6px 8px;background:hsl(var(--muted));border-radius:10px;font-size:13px;width:100%;min-width:0}
.rep-row .r-ord{font-family:var(--font-display);font-weight:700;color:hsl(var(--primary));width:18px;text-align:center;flex-shrink:0}
.rep-row .rn{flex:1 1 40px;min-width:40px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-row .select-input{height:30px;font-size:12.5px;padding:0 22px 0 6px;flex-shrink:0;max-width:64px}
.rep-row .icon-ghost{width:28px;height:28px;flex-shrink:0}
.icon-ghost:disabled{opacity:0.35;pointer-events:none}
/* Linha de resultados + filtros ativos */
.results-line{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:hsl(var(--muted-foreground));margin-bottom:12px}
.results-line .fchip{min-height:28px;padding:4px 10px}
/* Rascunho + destaque de item novo */
.badge-draft{background:hsl(var(--muted));color:hsl(var(--muted-foreground));border:1px dashed hsl(var(--muted-foreground) / 0.4)}
.badge-pend{background:hsla(38,80%,52%,0.15);color:hsl(38 70% 32%)}
@keyframes new-glow{from{box-shadow:0 0 0 3px hsla(38,80%,52%,0.4)}to{box-shadow:var(--shadow-soft)}}
.crud-row.fresh,.escala.fresh{animation:new-glow 2s ease-out}

</style>
</head>

<script>
/* LouvorFlow UI Kit — views (Dashboard + Músicas)
 * Mobile-first rendering. Consumes shell.css primitives.
 */

(() => {
  const content = document.getElementById("content");
  const crumbs  = document.getElementById("crumbs");
  const toggle  = document.getElementById("toggle-sidebar");
  const theme   = document.getElementById("toggle-theme");
  const sunIc   = theme.querySelector(".ic-sun");
  const moonIc  = theme.querySelector(".ic-moon");
  const app     = document.querySelector(".app");

  /* inject scrim */
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  app.appendChild(scrim);
  scrim.addEventListener("click", () => app.classList.remove("drawer-open"));

  toggle.addEventListener("click", () => app.classList.toggle("drawer-open"));

  /* theme */
  const applyTheme = (dark) => {
    document.documentElement.classList.toggle("dark", dark);
    sunIc.style.display = dark ? "none" : "";
    moonIc.style.display = dark ? "" : "none";
    localStorage.setItem("lf-theme", dark ? "dark" : "light");
  };
  applyTheme(localStorage.getItem("lf-theme") === "dark");
  theme.addEventListener("click", () => applyTheme(!document.documentElement.classList.contains("dark")));

  /* Icons (Lucide minimal inline) */
  const I = {
    music:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    users:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    trending: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>',
    plus:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    search:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    filter:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
    key:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>',
    chevron:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
    corner:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>'

    { day: 24, month: "Abr", title: "Ensaio Geral",              meta: "Banda + Vocal",            tag: "Ensaio" },

    { name: "Bruno Lima",    role: "Violão · Guitarra" },
    { name: "Carla Freitas", role: "Teclado" },

  /* ── Views ─────────────────────────────────────────────── */

  function renderDashboard() {
    crumbs.textContent = "Dashboard";
    content.innerHTML = `
      <div class="page-head">
        <div class="page-head-row">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-sub">Visão geral do ministério de louvor</p>

          <button class="btn btn-primary btn-sm" data-open="escala">${I.plus}<span>Nova Escala</span></button>

      <div class="stat-grid">
        <div class="stat"><div class="tint"></div>
          <div class="ic">${I.music}</div>

        <div class="stat"><div class="tint" style="background:linear-gradient(135deg,hsl(var(--secondary)),hsl(var(--accent)))"></div>
          <div class="ic" style="background:hsla(350,45%,42%,0.12);color:hsl(var(--accent))">${I.calendar}</div>
          <h3>Escalas</h3><div class="val">36</div><div class="foot">${upcoming.length} próximas</div>
        </div>
        <div class="stat"><div class="tint" style="background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--primary)))"></div>
          <div class="ic">${I.users}</div>
          <h3>Integrantes</h3><div class="val">18</div><div class="foot">Membros ativos</div>
        </div>
        <div class="stat"><div class="tint"></div>
          <div class="ic">${I.trending}</div>
          <h3>Novas Músicas</h3><div class="val">9</div><div class="foot">Adicionadas no mês</div>
        </div>
      </div>

      <div class="dash-grid">
        <section class="card">
          <div class="card-head">
            <h2 class="section-title">${I.calendar} Próximas Escalas</h2>
            <button class="btn btn-outline btn-sm" data-goto="escalas">Ver todas ${I.chevron}</button>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px">
            ${upcoming.map(e => eventRow(e)).join("")}
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="section-title">${I.users} Equipe do Ministério</h2>
            <button class="btn btn-outline btn-sm" data-goto="integrantes">Ver integrantes ${I.chevron}</button>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px">
            ${team.map(m => `
              <div class="member-row">
                <div class="member-avatar">${initials(m.name)}</div>
                <div style="min-width:0">
                  <div class="member-name">${m.name}</div>
                  <div class="member-role">${m.role}</div>
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      </div>
    `;
  }

  const INT_OPTS = [
    { value: "calma",   label: "Calma",   bars: 3 },
    { value: "media",   label: "Média",   bars: 4 },
    { value: "agitada", label: "Agitada", bars: 5 }
  ];
  const ibars = (n) => `<span class="ibars">${[4,6,8,10,12].map((h,i) => `<i class="${i < n ? "f" : ""}" style="height:${h}px"></i>`).join("")}</span>`;

  function renderSongs() {
    crumbs.textContent = "Músicas";
    const all = JSON.parse(document.getElementById("songs-data").textContent);
    const cats = [...new Set(all.map(s => s.cat))];
    const state = { q: "", ints: new Set(), cats: new Set(), page: 1 };
    const PER = 8;
    content.innerHTML = `
      <div class="page-head">
        <div class="page-head-row">
          <div>
            <h1 class="page-title">Músicas</h1>
            <p class="page-sub">Gerencie o repertório do ministério</p>
          </div>
          <button class="btn btn-primary btn-sm" data-open="musica">${I.plus}<span>Nova Música</span></button>
        </div>
      </div>
      <section class="card">
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
          <div class="input-wrap">${I.search}<input class="input" id="song-q" placeholder="Buscar músicas por nome..." aria-label="Buscar músicas por nome"/></div>
          <div class="filter-row" id="int-filters" role="group" aria-label="Filtrar por intensidade (tempo)">
            ${INT_OPTS.map(o => `<button class="fchip" data-int="${o.value}" aria-pressed="false">${ibars(o.bars)}${o.label}</button>`).join("")}
          </div>

        <div id="song-results"></div>
      </section>`;

    function draw() {
      const q = state.q.trim().toLowerCase();
      const list = all.filter(s =>
        (!q || s.nome.toLowerCase().includes(q) || s.artista.toLowerCase().includes(q)) &&
        (state.ints.size === 0 || state.ints.has(s.int)) &&
        (state.cats.size === 0 || state.cats.has(s.cat))
      );
      const pages = Math.max(1, Math.ceil(list.length / PER));
      if (state.page > pages) state.page = pages;
      const slice = list.slice((state.page - 1) * PER, state.page * PER);
      const active = [...state.ints].map(v => INT_OPTS.find(o => o.value === v).label).concat([...state.cats]);
      const hasFilters = q || active.length > 0;
      if (list.length === 0) {
        results.innerHTML = `
          <div class="empty">
            <div class="empty-ic">${I.music}</div>
            <div class="empty-title">${hasFilters ? "Nenhum resultado encontrado" : "Nenhuma música cadastrada"}</div>

          </div>`;
        results.querySelector("#clear-f")?.addEventListener("click", clearAll);
        return;
      }
      results.innerHTML = `
        <div class="results-line">
          <span><b style="color:hsl(var(--foreground))">${list.length}</b> música${list.length !== 1 ? "s" : ""}${q ? ` para "${state.q.trim()}"` : ""}</span>
          ${active.map(f => `<span class="badge badge-soft">${f}</span>`).join("")}
          ${hasFilters ? `<button class="fchip" id="clear-f">Limpar filtros</button>` : ""}
        </div>
        <div class="song-list">
          ${slice.map(s => `
            <div class="song" role="button" tabindex="0">
              <div class="song-tile">${I.music}</div>
              <div class="song-title">${s.nome}</div>
              <div class="song-artist">${s.artista}</div>
              <div class="song-meta">
                <span>${s.bpm} BPM</span>
                <span class="badge badge-soft">${s.cat}</span>
                <button class="btn btn-outline btn-sm">Detalhes</button>
              </div>
              <div class="song-key">
                <span class="k">${s.tom}</span>
                <span class="bpm">${s.bpm} BPM</span>
              </div>
            </div>`).join("")}
        </div>
        ${pages > 1 ? `
          <div class="pager">
            <button class="btn btn-outline btn-sm" data-pg="-1" ${state.page <= 1 ? "disabled" : ""}>‹ Anterior</button>
            <span class="pg">Página ${state.page} de ${pages}</span>
            <button class="btn btn-outline btn-sm" data-pg="1" ${state.page >= pages ? "disabled" : ""}>Próxima ›</button>
          </div>` : ""}`;
      results.querySelectorAll("[data-pg]").forEach(b => b.addEventListener("click", () => { state.page += +b.dataset.pg; draw(); }));
      results.querySelector("#clear-f")?.addEventListener("click", clearAll);
    }
    function clearAll() {
      state.q = ""; state.ints.clear(); state.cats.clear(); state.page = 1;
      content.querySelector("#song-q").value = "";
      content.querySelectorAll("#int-filters .fchip.on, #cat-filters .fchip.on").forEach(b => { b.classList.remove("on"); b.setAttribute("aria-pressed", "false"); });
      draw();
    }
    content.querySelector("#song-q").addEventListener("input", (e) => { state.q = e.target.value; state.page = 1; draw(); });
    content.querySelector("#int-filters").addEventListener("click", (e) => {
      const b = e.target.closest(".fchip"); if (!b) return;
      b.classList.toggle("on");
      b.setAttribute("aria-pressed", b.classList.contains("on"));
      state.ints.has(b.dataset.int) ? state.ints.delete(b.dataset.int) : state.ints.add(b.dataset.int);
      state.page = 1; draw();
    });
    content.querySelector("#cat-filters").addEventListener("click", (e) => {
      const b = e.target.closest(".fchip"); if (!b) return;
      b.classList.toggle("on");
      b.setAttribute("aria-pressed", b.classList.contains("on"));
      state.cats.has(b.dataset.cat) ? state.cats.delete(b.dataset.cat) : state.cats.add(b.dataset.cat);
      state.page = 1; draw();
    });
    draw();
  }

  function renderConfig() {
    crumbs.textContent = "Configurações";
    const tabs = [
      ["artistas","Artistas","Artista"],
      ["categorias","Categorias","Categoria"],
      ["funcoes","Funções","Função"],
      ["grupos","Grupos",null],
      ["tonalidades","Tonalidades","Tonalidade"],
      ["tipos","Tipos de Evento","Tipo de Evento"]
    ];
    let active = "artistas";
    content.innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="page-title">Configurações</h1>
          <p class="page-sub">Gerencie os cadastros auxiliares do sistema</p>
        </div>
      </div>
      <section class="card">
        <div class="tabs scroll-x" id="cfg-tabs" role="tablist" style="margin-bottom:16px;max-width:100%">
          ${tabs.map(([id,label]) => `<button class="tab ${id === active ? "active" : ""}" data-tab="${id}" style="white-space:nowrap">${label}</button>`).join("")}
        </div>
        <div id="cfg-body"></div>
      </section>`;
    const body = content.querySelector("#cfg-body");

    function drawSimple(key, label, freshI = -1) {
      const items = configData[key];
      body.innerHTML = `
        <div class="crud-add">
          <input class="input" id="crud-new" placeholder="Novo(a) ${label.toLowerCase()}..." aria-label="Novo(a) ${label.toLowerCase()}"/>
          <button class="btn btn-primary" id="crud-add-btn" aria-label="Confirmar criação" style="width:44px;padding:0">${I.corner}</button>
        </div>
        <div class="f-err" id="crud-err" style="margin:-6px 0 12px">Já existe um item com esse nome.</div>
        ${items.length === 0 ? `
          <div class="empty"><div class="empty-ic">${I.music}</div><div class="empty-title">Nenhum item cadastrado</div><div class="empty-sub">Adicione usando o campo acima.</div></div>` : `
        <div class="crud-list">
          ${items.map((n,i) => `
            <div class="crud-row${i === freshI ? " fresh" : ""}" data-i="${i}">
              <span class="cname">${n}</span>
              <span style="display:flex;gap:2px">
                <button class="icon-ghost" data-act="edit" aria-label="Editar ${label.toLowerCase()}">${I2.edit}</button>
                <button class="icon-ghost danger" data-act="del" aria-label="Excluir ${label.toLowerCase()}">${I2.trash}</button>
              </span>
            </div>`).join("")}
        </div>`}`;
      const inp = body.querySelector("#crud-new");
      const err = body.querySelector("#crud-err");
      const add = () => {
        const v = inp.value.trim(); if (!v) return;
        if (items.some(x => x.toLowerCase() === v.toLowerCase())) { err.style.display = "block"; inp.focus(); return; }
        items.push(v);
        drawSimple(key, label, items.length - 1);
        body.querySelector("#crud-new").focus();
      };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
      inp.addEventListener("input", () => { err.style.display = ""; });
      body.querySelector("#crud-add-btn").addEventListener("click", add);
      body.querySelectorAll(".crud-row").forEach(row => {
        const i = +row.dataset.i;
        row.querySelector('[data-act="del"]').addEventListener("click", () => {
          openConfirm(`Excluir ${label}`, `Tem certeza que deseja excluir "${items[i]}"?`, () => {
            const [rm] = items.splice(i, 1);
            drawSimple(key, label);
            toast(`"${rm}" excluído(a).`, { undo: () => { items.splice(i, 0, rm); drawSimple(key, label); } });
          });
        });
        row.querySelector('[data-act="edit"]').addEventListener("click", () => {
          row.innerHTML = `
            <input class="input" style="height:38px;padding-left:12px;flex:1" value="${items[i]}"/>
            <span style="display:flex;gap:2px">
              <button class="icon-ghost" data-act="ok" aria-label="Salvar">${I2.check}</button>
              <button class="icon-ghost" data-act="cancel" aria-label="Cancelar">${I2.x}</button>
            </span>`;
          const einp = row.querySelector("input");
          einp.focus();
          const save = () => { const v = einp.value.trim(); if (v) items[i] = v; drawSimple(key, label); };
          row.querySelector('[data-act="ok"]').addEventListener("click", save);
          row.querySelector('[data-act="cancel"]').addEventListener("click", () => drawSimple(key, label));
          einp.addEventListener("keydown", e => { if (e.key === "Enter") save(); if (e.key === "Escape") drawSimple(key, label); });
        });
      });
    }

    function drawGrupos() {
      body.innerHTML = `
        <div class="crud-list">
          ${configData.grupos.map(([g, fns]) => `
            <div class="crud-row" style="align-items:flex-start;padding:12px 8px 12px 14px">
              <div style="min-width:0;flex:1">
                <div class="cname" style="margin-bottom:8px">${g}</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px">${fns.map(f => `<span class="badge badge-soft">${f}</span>`).join("")}</div>
              </div>
              <span style="display:flex;gap:2px;flex-shrink:0">
                <button class="icon-ghost" aria-label="Editar grupo">${I2.edit}</button>
                <button class="icon-ghost danger" aria-label="Excluir grupo">${I2.trash}</button>
              </span>
            </div>`).join("")}
        </div>
        <p style="font-size:12.5px;color:hsl(var(--muted-foreground));margin:12px 2px 0">Os grupos definem a ordem das funções na montagem de escalas.</p>`;
    }

    function drawTab() {
      const t = tabs.find(t => t[0] === active);
      if (active === "grupos") drawGrupos(); else drawSimple(active, t[2]);
    }
    content.querySelector("#cfg-tabs").addEventListener("click", e => {
      const t = e.target.closest(".tab"); if (!t) return;
      active = t.dataset.tab;
      content.querySelectorAll("#cfg-tabs .tab").forEach(x => x.classList.toggle("active", x.dataset.tab === active));
      drawTab();
    });
    drawTab();
  }

  /* ── Modal host & openers ─────────────────────────────── */
  const modalHost = document.getElementById("modal-host");
  const closeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  function openModal(html) {
    modalHost.innerHTML = html;

      m.dataset.dirty = "1";

  function closeModal() { modalHost.classList.remove("open"); modalHost.innerHTML = ""; document.body.style.overflow = ""; }
  function veil(m, o) {
    if (m.querySelector(".discard-veil")) return;
    const v = document.createElement("div");
    v.className = "discard-veil";
    v.innerHTML = `<h3>${o.title}</h3><p>${o.msg}</p><div class="dv-actions"><button class="btn btn-outline btn-sm" data-keep>${o.keep}</button><button class="btn ${o.danger ? "btn-danger" : "btn-primary"} btn-sm" data-act>${o.act}</button></div>`;
    m.appendChild(v);
    v.querySelector("[data-keep]").addEventListener("click", () => v.remove());
    v.querySelector("[data-act]").addEventListener("click", () => { v.remove(); o.onAct(); });
  }
  function requestClose() {
    const m = modalHost.querySelector(".modal");
    if (!m || m.dataset.dirty !== "1") return closeModal();
    veil(m, { title: "Descartar alterações?", msg: "O que você preencheu nesta janela será perdido.", keep: "Continuar editando", act: "Descartar", danger: true, onAct: closeModal });
  }
  function validateModal(m) {
    let first = null;
    m.querySelectorAll(".field").forEach(f => {
      const inp = f.querySelector("input, select, textarea");
      if (!inp) return;
      const missing = f.hasAttribute("data-req") && !inp.value.trim();
      const invalid = !!inp.value.trim() && !inp.checkValidity();
      f.classList.toggle("error", missing || invalid);
      if ((missing || invalid) && !first) first = inp;
    });
    if (first) first.focus();
    return !first;
  }
  const toastHost = document.getElementById("toast-host");
  function toast(msg, opts = {}) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `${I2.check}<span class="t-msg">${msg}</span>${opts.undo ? `<button class="t-undo">Desfazer</button>` : ""}`;
    toastHost.appendChild(el);
    let done = false;
    if (opts.undo) el.querySelector(".t-undo").addEventListener("click", () => { done = true; el.remove(); opts.undo(); });
    setTimeout(() => { if (!done) el.remove(); }, 4500);
  }
  modalHost.addEventListener("click", (e) => { if (e.target === modalHost) requestClose(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalHost.classList.contains("open")) requestClose();
    if (e.key === "/" && !modalHost.classList.contains("open") && e.target instanceof Element && !e.target.closest("input, textarea, select")) {
      const s = content.querySelector(".input");
      if (s) { e.preventDefault(); s.focus(); }
    }
  });

        </div>
      </div>`);
    const m = modalHost.querySelector(".modal");
    const selEl = m.querySelector("#rep-sel");
    const pickEl = m.querySelector("#rep-pick");
    let sel = [];
    function drawSel() {
      selEl.innerHTML = sel.map((s, ix) => `
        <div class="rep-row">
          <span class="r-ord">${ix + 1}</span><span class="rn">${s.nome}</span>
          <select class="select-input" data-tom="${ix}" aria-label="Tom de ${s.nome}">${tons.map(t => `<option${t === s.tom ? " selected" : ""}>${t}</option>`).join("")}</select>
          <button type="button" class="icon-ghost" data-mv="-1" data-ix="${ix}" aria-label="Mover para cima"${ix === 0 ? " disabled" : ""}>${I2.up}</button>
          <button type="button" class="icon-ghost" data-mv="1" data-ix="${ix}" aria-label="Mover para baixo"${ix === sel.length - 1 ? " disabled" : ""}>${I2.down}</button>
          <button type="button" class="icon-ghost danger" data-rm="${ix}" aria-label="Remover da escala">${I2.x}</button>
        </div>`).join("");
    }
    pickEl.addEventListener("click", (e) => {
      const row = e.target.closest(".picker-row"); if (!row) return;
      const nome = row.querySelector(".pn").textContent;
      if (row.classList.toggle("on")) {
        const s = songs.find(x => x.nome === nome);
        sel.push({ nome, tom: s ? s.tom : "C" });
      } else sel = sel.filter(x => x.nome !== nome);
      drawSel();
      m.dataset.dirty = "1";
    });
    selEl.addEventListener("click", (e) => {
      const mv = e.target.closest("[data-mv]");
      if (mv) {
        const ix = +mv.dataset.ix, j = ix + +mv.dataset.mv;
        [sel[ix], sel[j]] = [sel[j], sel[ix]];
        drawSel(); return;
      }
      const rm = e.target.closest("[data-rm]");
      if (rm) {
        const [out] = sel.splice(+rm.dataset.rm, 1);
        pickEl.querySelectorAll(".picker-row").forEach(r => { if (r.querySelector(".pn").textContent === out.nome) r.classList.remove("on"); });
        drawSel();
      }
    });
    selEl.addEventListener("change", (e) => {
      const t = e.target.closest("[data-tom]");
      if (t) sel[+t.dataset.tom].tom = t.value;
    });
    if (pre) {
      m.querySelector("#esc-title").value = pre.title || "";
      [...m.querySelector("#esc-tipo").options].forEach(o => { if (o.textContent === pre.tipo) o.selected = true; });
      (pre.band || []).forEach(n => m.querySelectorAll("#int-pick .picker-row").forEach(r => { if (r.querySelector(".pn").textContent === n) r.classList.add("on"); }));
      sel = (pre.songs || []).map(([k, t]) => ({ nome: t, tom: k }));
      sel.forEach(s => m.querySelectorAll("#rep-pick .picker-row").forEach(r => { if (r.querySelector(".pn").textContent === s.nome) r.classList.add("on"); }));
      drawSel();
      m.dataset.dirty = "1";
    }
    const collect = (draft) => {
      const MON = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
      const band = [...m.querySelectorAll("#int-pick .picker-row.on .pn")].map(x => x.textContent);
      const base = {
        tipo: m.querySelector("#esc-tipo").value,
        title: m.querySelector("#esc-title").value.trim() || "Escala sem título",
        band, songs: sel.map(s => [s.tom, s.nome]), fresh: true
      };
      const d = m.querySelector("#esc-date").value;
      if (draft || !d) return { ...base, day: "–", month: "", draft: true, when: [["calendar", "Data a definir"]] };
      const [y, mo, dd] = d.split("-").map(Number);
      return { ...base, day: dd, month: MON[mo - 1], when: [
        ["calendar", new Date(y, mo - 1, dd).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" })],
        ["clock", m.querySelector("#esc-time").value.replace(":", "h")],
        ["pin", m.querySelector("#esc-local").value.trim() || "A definir"]
      ] };
    };
    const land = (msg) => {
      closeModal();
      toast(msg);
      if (crumbs.textContent === "Escalas") go("escalas");
      else if (crumbs.textContent === "Dashboard") go("dashboard");
    };
    m.querySelector("#esc-draft").addEventListener("click", () => {
      escalasData.unshift(collect(true));
      land("Rascunho salvo — veja na lista de Escalas.");
    });
    m.querySelector("#esc-create").addEventListener("click", () => {
      if (!validateModal(m)) return;
      const finish = () => {
        const item = collect(false);
        escalasData.unshift(item);
        upcoming.unshift({ day: item.day, month: item.month, title: item.title, meta: `${item.songs.length} músicas · ${item.band.length} integrantes`, tag: item.tipo });
        land(pre ? "Escala duplicada." : "Escala criada.");
      };
      if (sel.length === 0) veil(m, { title: "Criar escala sem repertório?", msg: "Você pode adicionar as músicas agora ou depois, editando a escala.", keep: "Adicionar músicas", act: "Criar assim mesmo", onAct: finish });
      else finish();
    });
  }

          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline btn-sm" data-close>Fechar</button>
        </div>
      </div>`);
    modalHost.querySelector("#copy-invite").addEventListener("click", () => toast("Link de convite copiado."));
  }

  /* Chip & picker interactions (delegated) */
  modalHost.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip-pick button");
    const m = modalHost.querySelector(".modal");
    if (chip) {
      const group = chip.parentElement;
      if (group.hasAttribute("data-single")) {
        group.querySelectorAll("button").forEach(b => b.classList.remove("on"));
        chip.classList.add("on");
      } else chip.classList.toggle("on");
      if (m) m.dataset.dirty = "1";
      return;
    }
    const row = e.target.closest(".picker-row");
    if (row && !row.closest("#rep-pick")) { row.classList.toggle("on"); if (m) m.dataset.dirty = "1"; }
  });

  /* Hook any [data-open] button on pages */
  window.lfOpen = { musica: openNovaMusica, escala: openNovaEscala, integrante: openNovoIntegrante, usuario: () => openAdminForm("usuario"), role: () => openAdminForm("role"), permissao: () => openAdminForm("permissao"), igreja: () => openAdminForm("igreja"), convites: openConvites, "gerar-convite": openGerarConvite };
  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-goto]");
    if (g) { e.preventDefault(); go(g.dataset.goto); return; }
    const b = e.target.closest("[data-open]");
    if (!b) return;
    e.preventDefault();
    const fn = window.lfOpen[b.dataset.open];
    if (fn) fn();
  });

  /* ── Router ────────────────────────────────────────────── */
  const routes = {
    dashboard:   renderDashboard,
    songs:       renderSongs,
    escalas:     renderEscalas,
    integrantes: renderIntegrantes,
    historico:   renderHistorico,
    relatorios:  renderRelatorios,
    usuarios:    renderUsuarios,
    roles:       renderRoles,
    permissoes:  renderPermissoes,
    config:      renderConfig,
    igrejas:     renderIgrejas
  };
  function go(view) {
    if (!routes[view]) view = "dashboard";
    content.setAttribute("data-screen-label", view);
    document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === view));
    routes[view]();
    localStorage.setItem("lf-view", view);
    if (window.matchMedia("(max-width: 899px)").matches) app.classList.remove("drawer-open");
    window.scrollTo({ top: 0 });
  }

  document.querySelectorAll(".nav-item[data-view]").forEach(n => {
    n.addEventListener("click", (e) => { e.preventDefault(); go(n.dataset.view); });
  });

  go(localStorage.getItem("lf-view") || "dashboard");
})();

</script>
</body>
</html>
