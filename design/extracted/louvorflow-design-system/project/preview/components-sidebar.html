<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .sidebar { width:260px; background:hsl(38 40% 96%); border:1px solid hsl(35 18% 87%); border-radius:12px; padding:12px; display:flex; flex-direction:column }
  .brand { display:flex; align-items:center; gap:8px; padding:12px 8px 16px; border-bottom:1px solid hsl(35 18% 87%); margin-bottom:8px }
  .brand .name { font-size:18px; font-weight:700; letter-spacing:-0.02em; color:hsl(30 15% 18%) }
  .group-label { font-size:11px; text-transform:uppercase; color:hsl(30 12% 45%); letter-spacing:0.04em; padding:10px 10px 6px; font-weight:500 }
  .item { display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:8px; font-size:14px; color:hsl(30 15% 18%); cursor:pointer; transition:background 150ms }
  .item:hover { background:hsl(35 25% 91%) }
  .item.active { background:hsl(35 25% 91%); font-weight:500 }
  .item svg { width:18px;height:18px }
</style>
</head>
<body>
<div class="card-root" style="display:flex;gap:20px;align-items:flex-start">
  <div class="sidebar">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(30 15% 18%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="name">LouvorFlow</span>
    </div>
    <div class="group-label">Menu Principal</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Dashboard</div>
    <div class="item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Músicas</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Escalas</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Integrantes</div>
  </div>
  <div style="flex:1;padding-top:6px">
    <div class="mono" style="font-size:12px;color:hsl(30 12% 45%);line-height:1.5">
      Sidebar <strong style="color:hsl(30 15% 18%);font-weight:600">silencioso</strong> — mesma cor da canvas, separação só por borda.<br/>
      16rem expanded / 3rem collapsed / 18rem mobile overlay.<br/>
      Hover: <code style="background:hsl(35 20% 93%);padding:0 4px;border-radius:3px">sidebar-accent</code> · Active: same bg + <code style="background:hsl(35 20% 93%);padding:0 4px;border-radius:3px">font-medium</code>.
    </div>
  </div>
</div>
</body></html>
