<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-root">
  <div class="row" style="gap:10px">
    <div class="swatch" style="flex:1">
      <div class="chip" style="height:84px;background: linear-gradient(135deg, hsl(38 80% 52%), hsl(350 45% 42%))"></div>
      <div class="meta"><div class="name">gradient-primary</div><div class="hsl">135°  amber → wine</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="height:84px;background: linear-gradient(180deg, hsl(38 40% 96%), hsl(35 35% 94%))"></div>
      <div class="meta"><div class="name">gradient-subtle</div><div class="hsl">180°  cream shift</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="height:84px;background: linear-gradient(135deg, hsl(38 30% 99%), hsl(35 25% 97%))"></div>
      <div class="meta"><div class="name">gradient-card</div><div class="hsl">135°  warm card</div></div>
    </div>
  </div>
</div>
</body></html>
