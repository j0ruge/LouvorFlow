<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .field { display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px }
  .field label { font-size:13px; font-weight:500; color:hsl(30 15% 18%) }
  .input { height:40px; padding:0 12px; border-radius:10px; border:1px solid hsl(35 18% 87%); background:hsl(38 30% 99%); font-size:14px; color:hsl(30 15% 18%); font-family:inherit }
  .input:focus { outline:2px solid hsl(38 80% 52%); outline-offset:2px; border-color:hsl(38 80% 52%) }
  .err { font-size:12px; color:hsl(0 84% 60%) }
</style>
</head>
<body>
<div class="card-root">
  <div class="row">
    <div class="field">
      <label>E-mail</label>
      <input class="input" value="joao@igreja.com" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input class="input" type="password" value="••••••••" />
      <span class="err">E-mail ou senha inválidos.</span>
    </div>
  </div>
  <div class="mono" style="margin-top:14px">h-10 · rounded-md · border-input · focus: ring (amber) 2px outline</div>
</div>
</body></html>
