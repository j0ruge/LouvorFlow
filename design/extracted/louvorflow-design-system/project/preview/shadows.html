<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>.box { width:150px;height:80px;background:hsl(38 30% 99%);border-radius:12px; display:flex;align-items:center;justify-content:center;font-size:12px;color:hsl(30 12% 45%);font-family:ui-monospace,monospace }</style>
</head>
<body>
<div class="card-root">
  <div class="row" style="gap:24px;justify-content:center;padding:8px 0">
    <div class="col" style="align-items:center;gap:10px">
      <div class="box" style="box-shadow:0 2px 15px -3px hsl(30 40% 30% / 0.08)">shadow-soft</div>
      <div class="mono">resting cards</div>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div class="box" style="box-shadow:0 4px 25px -5px hsl(30 40% 30% / 0.12)">shadow-medium</div>
      <div class="mono">hover · dialogs</div>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div class="box" style="box-shadow:0 0 30px hsl(38 90% 60% / 0.3)">shadow-glow</div>
      <div class="mono">amber emphasis</div>
    </div>
  </div>
</div>
</body></html>
