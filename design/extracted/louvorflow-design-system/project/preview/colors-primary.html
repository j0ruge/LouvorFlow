<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-root">
  <div class="row" style="gap:10px">
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(38 80% 52%)"></div>
      <div class="meta"><div class="name">primary</div><div class="hsl">38 80% 52%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(40 75% 62%)"></div>
      <div class="meta"><div class="name">primary-light</div><div class="hsl">40 75% 62%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(38 90% 60%)"></div>
      <div class="meta"><div class="name">primary-glow</div><div class="hsl">38 90% 60%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(30 35% 45%)"></div>
      <div class="meta"><div class="name">secondary</div><div class="hsl">30 35% 45%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(350 45% 42%)"></div>
      <div class="meta"><div class="name">accent</div><div class="hsl">350 45% 42%</div></div>
    </div>
  </div>
</div>
</body></html>
