<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-root">
  <div class="row" style="gap:10px">
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(38 40% 96%); border-bottom: 1px solid hsl(35 18% 87%)"></div>
      <div class="meta"><div class="name">background</div><div class="hsl">38 40% 96%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(38 30% 99%); border-bottom: 1px solid hsl(35 18% 87%)"></div>
      <div class="meta"><div class="name">card</div><div class="hsl">38 30% 99%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(35 20% 93%)"></div>
      <div class="meta"><div class="name">muted</div><div class="hsl">35 20% 93%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(35 18% 87%)"></div>
      <div class="meta"><div class="name">border</div><div class="hsl">35 18% 87%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(30 12% 45%)"></div>
      <div class="meta"><div class="name">muted-fg</div><div class="hsl">30 12% 45%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(30 15% 18%)"></div>
      <div class="meta"><div class="name">foreground</div><div class="hsl">30 15% 18%</div></div>
    </div>
  </div>
</div>
</body></html>
