<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-root">
  <div class="row" style="align-items:flex-end;gap:18px">
    <div class="col" style="align-items:center;gap:6px"><div style="width:4px;height:4px;background:hsl(38 80% 52%);border-radius:2px"></div><div class="mono">1 / 4px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:8px;height:8px;background:hsl(38 80% 52%);border-radius:2px"></div><div class="mono">2 / 8px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:12px;height:12px;background:hsl(38 80% 52%);border-radius:2px"></div><div class="mono">3 / 12px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:16px;height:16px;background:hsl(38 80% 52%);border-radius:3px"></div><div class="mono">4 / 16px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:24px;height:24px;background:hsl(38 80% 52%);border-radius:4px"></div><div class="mono">6 / 24px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:32px;height:32px;background:hsl(38 80% 52%);border-radius:4px"></div><div class="mono">8 / 32px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:48px;height:48px;background:hsl(38 80% 52%);border-radius:6px"></div><div class="mono">12 / 48px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:hsl(38 80% 52%);border-radius:8px"></div><div class="mono">16 / 64px</div></div>
  </div>
  <div class="mono" style="margin-top:14px">4 px base grid · Tailwind default · p-4 mobile / p-6 desktop for containers</div>
</div>
</body></html>
