<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-root">
  <div class="row" style="gap:10px">
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(0 84% 60%)"></div>
      <div class="meta"><div class="name">destructive</div><div class="hsl">0 84% 60%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(38 80% 52%)"></div>
      <div class="meta"><div class="name">ring / focus</div><div class="hsl">38 80% 52%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsla(38,80%,52%,0.1); border-bottom:1px solid hsl(35 18% 87%)"></div>
      <div class="meta"><div class="name">badge chip</div><div class="hsl">primary / 10%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsla(0,84%,60%,0.1); border-bottom:1px solid hsl(35 18% 87%)"></div>
      <div class="meta"><div class="name">error bg</div><div class="hsl">destructive / 10%</div></div>
    </div>
  </div>
</div>
</body></html>
