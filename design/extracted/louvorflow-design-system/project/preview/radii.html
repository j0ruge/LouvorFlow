<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-root">
  <div class="row">
    <div class="col" style="align-items:center;gap:8px;flex:1">
      <div style="width:80px;height:60px;background:hsl(38 30% 99%);border:1px solid hsl(35 18% 87%);border-radius:8px"></div>
      <div class="mono">sm · 8px</div>
      <div class="label" style="font-size:10px">badges / chips</div>
    </div>
    <div class="col" style="align-items:center;gap:8px;flex:1">
      <div style="width:80px;height:60px;background:hsl(38 30% 99%);border:1px solid hsl(35 18% 87%);border-radius:10px"></div>
      <div class="mono">md · 10px</div>
      <div class="label" style="font-size:10px">inputs / buttons</div>
    </div>
    <div class="col" style="align-items:center;gap:8px;flex:1">
      <div style="width:80px;height:60px;background:hsl(38 30% 99%);border:1px solid hsl(35 18% 87%);border-radius:12px"></div>
      <div class="mono">lg · 12px (base)</div>
      <div class="label" style="font-size:10px">cards / dialogs</div>
    </div>
    <div class="col" style="align-items:center;gap:8px;flex:1">
      <div style="width:60px;height:60px;background:linear-gradient(135deg,hsl(38 80% 52%),hsl(350 45% 42%));border-radius:9999px"></div>
      <div class="mono">full · 9999</div>
      <div class="label" style="font-size:10px">avatars / pills</div>
    </div>
  </div>
</div>
</body></html>
