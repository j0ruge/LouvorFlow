<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { background:hsl(38 30% 99%); border:1px solid hsl(35 18% 87%); border-radius:12px; box-shadow:0 2px 15px -3px hsl(30 40% 30% / 0.08); padding:18px; min-width:0 }
  .card h3 { margin:0 0 4px; font-size:14px; font-weight:500; color:hsl(30 12% 45%); letter-spacing:0 }
  .card .val { font-size:26px; font-weight:700; color:hsl(30 15% 18%) }
  .card .foot { font-size:12px; color:hsl(30 12% 45%); margin-top:4px }
  .icon { width:20px;height:20px; color:hsl(38 80% 52%) }
  .head { display:flex; justify-content:space-between; align-items:center; padding-bottom:8px }
  .tint { position:absolute; inset:0; background:linear-gradient(135deg, hsl(38 80% 52%), hsl(40 75% 62%)); opacity:0.06 }
  .wrap { position:relative; overflow:hidden; border-radius:12px }
</style>
</head>
<body>
<div class="card-root">
  <div class="row" style="gap:12px">
    <div class="wrap" style="flex:1">
      <div class="card" style="position:relative">
        <div class="tint"></div>
        <div class="head"><h3>Total de Músicas</h3>
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="val">247</div>
        <div class="foot">Cadastradas no repertório</div>
      </div>
    </div>
    <div class="wrap" style="flex:1">
      <div class="card" style="position:relative">
        <div class="tint" style="background:linear-gradient(135deg, hsl(30 35% 45%), hsl(350 45% 42%))"></div>
        <div class="head"><h3>Escalas</h3>
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="val">36</div>
        <div class="foot">5 próximas</div>
      </div>
    </div>
    <div class="wrap" style="flex:1">
      <div class="card" style="position:relative">
        <div class="tint" style="background:linear-gradient(135deg, hsl(350 45% 42%), hsl(38 80% 52%))"></div>
        <div class="head"><h3>Integrantes</h3>
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="val">18</div>
        <div class="foot">Membros do ministério</div>
      </div>
    </div>
  </div>
</div>
</body></html>
