<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: hsl(30 12% 12%); color: hsl(35 20% 88%); }
  .swatch .meta { background: hsl(30 10% 15%); }
  .swatch .meta .name { color: hsl(35 20% 88%); }
  .swatch { border-color: hsl(30 8% 22%); }
</style>
</head>
<body>
<div class="card-root">
  <div class="row" style="gap:10px">
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(30 12% 12%)"></div>
      <div class="meta"><div class="name">background</div><div class="hsl">30 12% 12%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(30 10% 15%)"></div>
      <div class="meta"><div class="name">card</div><div class="hsl">30 10% 15%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(40 65% 55%)"></div>
      <div class="meta"><div class="name">primary</div><div class="hsl">40 65% 55%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(350 35% 50%)"></div>
      <div class="meta"><div class="name">accent</div><div class="hsl">350 35% 50%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(30 8% 20%)"></div>
      <div class="meta"><div class="name">muted</div><div class="hsl">30 8% 20%</div></div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background: hsl(35 20% 88%)"></div>
      <div class="meta"><div class="name">foreground</div><div class="hsl">35 20% 88%</div></div>
    </div>
  </div>
</div>
</body></html>
