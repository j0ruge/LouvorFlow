name: CD Production Backend

on:
  push:
    tags:
      - 'backend-v*'

permissions:
  packages: write
  contents: read

concurrency:
  group: deploy-production-louvorflow-backend
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: louvorflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn workspace backend run prisma generate
        env:
          DB_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: yarn workspace backend run typecheck

      - name: Test
        run: yarn workspace backend run test
        env:
          DB_URL: postgresql://test:test@localhost:5432/louvorflow_test?schema=public

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/j0ruge/louvorflow-api:${{ github.ref_name }}
            ghcr.io/j0ruge/louvorflow-api:latest
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    name: Deploy Production
    runs-on: [self-hosted, production]
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Pull backend image (with retry)
        uses: ./.github/actions/docker-pull
        with:
          command: docker pull ghcr.io/j0ruge/louvorflow-api:${{ github.ref_name }}

      - name: Run database migrations
        run: |
          docker run --rm --network ${{ secrets.NGINX_NETWORK_NAME }} \
            -e DB_URL=${{ secrets.DB_URL }} \
            ghcr.io/j0ruge/louvorflow-api:${{ github.ref_name }} \
            npx prisma migrate deploy --schema packages/backend/prisma/schema.prisma

      - name: Run admin seed
        run: |
          docker run --rm --network ${{ secrets.NGINX_NETWORK_NAME }} \
            -e DB_URL=${{ secrets.DB_URL }} \
            -e ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }} \
            -e ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} \
            -e ADMIN_NAME=${{ secrets.ADMIN_NAME }} \
            ghcr.io/j0ruge/louvorflow-api:${{ github.ref_name }} \
            npx tsx packages/backend/seeds/admin.ts

      - name: Generate .env
        working-directory: infra/backend
        run: |
          umask 077
          cat <<'EOF' > .env
          HOST=${{ secrets.HOST }}
          PORT=${{ secrets.PORT }}
          DB_URL=${{ secrets.DB_URL }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          ACCESS_TOKEN_EXPIRES_IN=${{ secrets.ACCESS_TOKEN_EXPIRES_IN }}
          APP_SECRET_REFRESH_TOKEN=${{ secrets.APP_SECRET_REFRESH_TOKEN }}
          REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN }}
          REFRESH_TOKEN_EXPIRES_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRES_DAYS }}
          APP_API_URL=${{ secrets.APP_API_URL }}
          APP_WEB_URL=${{ secrets.APP_WEB_URL }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME=${{ secrets.ADMIN_NAME }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          APP_SECRET_SELECTION_TOKEN=${{ secrets.APP_SECRET_SELECTION_TOKEN }}
          IMAGE_TAG=${{ github.ref_name }}
          NGINX_NETWORK_NAME=${{ secrets.NGINX_NETWORK_NAME }}
          VIRTUAL_HOST=${{ secrets.VIRTUAL_HOST }}
          EOF

      - name: Pull compose images (with retry)
        uses: ./.github/actions/docker-pull
        with:
          working-directory: infra/backend
          command: docker compose -p louvorflow-api pull

      - name: Deploy
        working-directory: infra/backend
        run: docker compose -p louvorflow-api up -d --force-recreate

      - name: Smoke test (health + SHA)
        env:
          API_BASE: ${{ secrets.APP_API_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Normaliza a base: tolera barra final e um sufixo /api acidental no secret.
          base="${API_BASE%/}"; base="${base%/api}"
          HEALTH_URL="$base/api/health"
          echo "Smoke test em $HEALTH_URL (esperando sha=$EXPECTED_SHA)"
          for i in $(seq 1 10); do
            body=$(curl -fsS -m 10 "$HEALTH_URL" 2>/dev/null || true)
            sha=$(printf '%s' "$body" | sed -nE 's/.*"sha"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/p' | head -1)
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              echo "✅ Deploy verificado: SHA no ar = $EXPECTED_SHA"
              exit 0
            fi
            echo "Tentativa $i/10: SHA no ar='${sha:-<sem resposta>}' (esperado $EXPECTED_SHA); aguardando recriação do container..."
            sleep 6
          done
          echo "::error::Smoke test falhou: /api/health não reportou o SHA $EXPECTED_SHA após 10 tentativas — o container provavelmente não foi atualizado."
          exit 1

      - name: Cleanup images
        run: docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/j0ruge/LouvorFlow"

      - name: Cleanup .env
        if: always()
        working-directory: infra/backend
        run: rm -f .env

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ci, build-and-push, deploy]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Abrir issue de falha de deploy
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const title = `🚨 Deploy falhou: ${context.workflow} (${sha})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `O workflow **${context.workflow}** falhou para o commit \`${context.sha}\`.`,
              '',
              `- Run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              '',
              'Causa provável: falha transitória de rede no ghcr.io (pull) ou runner self-hosted offline.',
              `Reexecute com \`gh run rerun --failed ${context.runId}\` após verificar o log.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deploy-failure'],
            });
